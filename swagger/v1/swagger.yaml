---
openapi: 3.0.1
info:
  title: Rexone Core API
  version: v1
  description: |
    Production API foundation for authentication, IAM, payments, access,
    media, notifications, client observability, and AI conversations.

    Authenticated endpoints use a bearer JWT. Send `X-Platform` as `web`,
    `android`, or `ios` to select the active session, and `X-Locale` as
    `en`, or `my` to select translated response messages.
tags:
  - name: Authentication
    description: Account registration, confirmation, sessions, and password recovery.
  - name: Users
    description: Authenticated user profile and effective IAM information.
  - name: Admin / Users
    description:
      Admin dashboard user operations. Requires the admin role and the matching
      user permission.
  - name: Admin / Notifications
    description:
      Admin notification dispatch. Requires the admin role and create_notifications
      permission.
  - name: IAM Permissions
    description: Super-admin permission management.
  - name: IAM Roles
    description: Role definitions and their permission assignments.
  - name: IAM User Roles
    description: Admin-managed role assignments for users.
  - name: Payments
    description: Products, checkout sessions, subscriptions, and transactions.
  - name: Accesses
    description: Product-access inspection and revocation.
  - name: Media
    description: Synchronous multipart asset upload.
  - name: AI
    description: Durable queued chat plus synchronous text utilities.
  - name: Client Logs
    description: Client error ingestion and authorized operational review.
  - name: Webhooks
    description: Provider-signed inbound webhooks.
components:
  schemas:
    signup_request:
      type: object
      properties:
        user:
          type: object
          properties:
            username:
              type: string
              pattern: "^[a-z0-9_]+$"
              example: elden_lord
            name:
              type: string
              maxLength: 50
              example: Elden Lord
            email:
              type: string
              format: email
              example: lord@example.com
            password:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            password_confirmation:
              type: string
              format: password
              minLength: 6
              writeOnly: true
          required:
            - username
            - name
            - email
            - password
            - password_confirmation
      required:
        - user
    signin_request:
      type: object
      properties:
        user:
          type: object
          properties:
            signin_key:
              type: string
              description: Email address or username
              example: elden_lord
            password:
              type: string
              format: password
              writeOnly: true
          required:
            - signin_key
            - password
      required:
        - user
    token_signin_request:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          description: One-time account sign-in token.
      required:
        - token
    google_signin_request:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          description: Google identity token.
      required:
        - token
    google_registration_request:
      type: object
      properties:
        challenge_token:
          type: string
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 6
          writeOnly: true
      required:
        - challenge_token
        - password
    confirmation_code_request:
      type: object
      properties:
        signin_key:
          type: string
          description: Email address or username.
      required:
        - signin_key
    confirmation_verify_request:
      type: object
      properties:
        signin_key:
          type: string
          description: Email address or username.
        confirmation_code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "123456"
      required:
        - signin_key
        - confirmation_code
    forgot_password_request:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    reset_password_request:
      type: object
      properties:
        user:
          type: object
          properties:
            reset_password_token:
              type: string
              writeOnly: true
            password:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            password_confirmation:
              type: string
              format: password
              minLength: 6
              writeOnly: true
          required:
            - reset_password_token
            - password
            - password_confirmation
      required:
        - user
    role_request:
      type: object
      properties:
        name:
          type: string
          example: teacher
        description:
          type: string
          nullable: true
        permission_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Permission UUIDs assigned to the role.
      required:
        - name
    permission_request:
      type: object
      properties:
        action:
          type: string
          enum:
            - read
            - create
            - update
            - delete
          example: read
        resource:
          type: string
          enum:
            - users
            - roles
            - user_roles
            - permissions
            - products
            - payments
            - subscriptions
            - transactions
            - accesses
            - assets
            - notifications
            - ai
            - clients
            - feedbacks
            - analytics
          example: users
      required: []
    admin_user_request:
      type: object
      properties:
        user:
          type: object
          properties:
            username:
              type: string
              pattern: "^[a-z0-9_]+$"
              example: admin_created
            name:
              type: string
              maxLength: 50
              example: Admin Created
            email:
              type: string
              format: email
              example: admin-created@example.com
            password:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            password_confirmation:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            role_ids:
              type: array
              uniqueItems: true
              items:
                type: string
                format: uuid
          required: []
      required:
        - user
    admin_chat_room_request:
      type: object
      properties:
        room:
          type: object
          properties:
            title:
              type: string
              minLength: 1
              example: Support chat
          required:
            - title
      required:
        - room
    admin_chat_message_request:
      type: object
      properties:
        message:
          type: object
          properties:
            role:
              type: string
              enum:
                - user
                - assistant
            content:
              type: string
              minLength: 1
              example: Updated message content
          required: []
      required:
        - message
    admin_product_request:
      type: object
      properties:
        product:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              example: Premium Access
            description:
              type: string
              nullable: true
              example: Unlocks premium features.
            price_unit_amount:
              type: integer
              minimum: 0
              description:
                Amount in the smallest currency unit, for example cents.
                Use 0 for a free product.
            currency:
              type: string
              enum:
                - usd
              example: usd
            cycle:
              type: string
              nullable: true
              enum:
                - month
                - year
                -
              description: Use null for one-time products.
            active:
              type: boolean
              default: true
          required:
            - name
            - price_unit_amount
            - currency
      required:
        - product
    user_role_request:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
          description: Role UUID to assign to the path user.
      required:
        - role_id
    client_log_context:
      type: object
      description:
        Free-form, JSON-safe diagnostic context supplied by the client.
        Do not include secrets or tokens.
      additionalProperties: true
      example:
        component: CheckoutPage
        action: loadSession
        attempt: 2
    client_log_request:
      type: object
      properties:
        log:
          type: object
          properties:
            message:
              type: string
              example: Checkout request failed
            severity:
              type: string
              enum:
                - debug
                - info
                - warning
                - error
                - critical
              default: error
            platform:
              type: string
              enum:
                - web
                - ios
                - android
              nullable: true
            environment:
              type: string
              enum:
                - development
                - staging
                - production
              nullable: true
            app_version:
              type: string
              nullable: true
            browser:
              type: string
              nullable: true
            user_agent:
              type: string
              nullable: true
            os:
              type: string
              nullable: true
            os_version:
              type: string
              nullable: true
            device:
              type: string
              nullable: true
            url:
              type: string
              format: uri
              nullable: true
            method:
              type: string
              example: POST
              nullable: true
            context:
              "$ref": "#/components/schemas/client_log_context"
            stack_trace:
              type: array
              items:
                type: string
            local_storage_keys:
              type: array
              items:
                type: string
            session_storage_keys:
              type: array
              items:
                type: string
            cookies:
              type: object
              description:
                Cookie names and diagnostic values. Do not submit authentication
                cookies or secrets.
              additionalProperties:
                type: string
          required:
            - message
      required:
        - log
    notification_request:
      type: object
      properties:
        event:
          type: string
          enum:
            - general_announcement
            - maintenance_notice
            - feature_update
          description:
            Admin-enabled event whose server-side template supplies the
            title and message.
        audience:
          description:
            Use exactly one audience shape. Role matches use OR semantics
            and each user is notified once.
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - users
                user_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
              required:
                - type
                - user_ids
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - roles
                role_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
              required:
                - type
                - role_ids
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - all
              required:
                - type
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - socket
              - push
              - email
          description: "One or more delivery channels: socket, push, or email."
      required:
        - event
        - audience
        - channels
    asset_upload_request:
      type: object
      properties:
        file:
          type: string
          format: binary
        type:
          type: string
          default: general
          description:
            "Asset type: avatar, cover, card, audio, video, attachment,
            general."
        resource_model:
          type: string
          description:
            "Resource model name: user, course, lesson, monastery, teacher,
            message."
        resource_id:
          type: string
          format: uuid
          description: UUID of the linked resource.
        duration_secs:
          type: integer
          description: Duration in seconds for audio / video files.
        size_bytes:
          type: integer
          description: Exact file size in bytes.
      required:
        - file
    checkout_session_request:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        success_url:
          type: string
          format: uri
          description: Client URL used by Stripe after success.
        cancel_url:
          type: string
          format: uri
          description: Client URL used by Stripe after cancellation.
      required:
        - product_id
        - success_url
        - cancel_url
    ai_chat_request:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        room_id:
          type: string
          format: uuid
          description:
            Existing owned room UUID. Omit to use or create the current
            room.
        system_prompt:
          type: string
          nullable: true
          description: Optional instruction prepended to this request.
        temperature:
          type: number
          format: float
          default: 0.7
          minimum: 0
        max_tokens:
          type: integer
          default: 2000
          minimum: 1
      required:
        - message
    ai_rename_request:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        room_id:
          type: string
          format: uuid
          description: Owned room UUID. Omit to use the current room.
      required:
        - title
    ai_room_request:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Omit to use the translated default room title.
      required: []
    ai_text_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
        - text
    ai_translate_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
          description:
            Natural-language target such as English, Myanmar, Japanese,
            or Spanish; not a fixed enum.
      required:
        - text
        - language
    ai_analyze_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - sentiment
            - entities
            - keywords
          default: sentiment
      required:
        - text
    ai_message_metadata:
      type: object
      properties:
        status:
          type: string
          enum:
            - queued
            - processing
            - retrying
            - completed
            - failed
          description: Processing state; set on queued user messages.
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          format: float
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        assistant_message_id:
          type: string
          format: uuid
          nullable: true
        error:
          type: string
          nullable: true
        usage:
          type: object
          nullable: true
          description: Provider token-usage object returned for an assistant response.
          additionalProperties: true
          example:
            prompt_tokens: 42
            completion_tokens: 18
            total_tokens: 60
        model:
          type: string
          nullable: true
          description: Provider model identifier used for the response.
      required: []
    response:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              example: 200
            success:
              type: boolean
              example: true
            message:
              type: string
          required:
            - code
            - success
            - message
        data:
          nullable: true
        meta:
          type: object
          properties:
            pagination:
              "$ref": "#/components/schemas/pagination"
          required: []
      required:
        - status
    error_response:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              example: 422
            success:
              type: boolean
              example: false
            message:
              type: string
            error:
              type: string
          required:
            - code
            - success
            - message
        data:
          nullable: true
      required:
        - status
    pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        limit:
          type: integer
        next_page:
          type: integer
          nullable: true
        prev_page:
          type: integer
          nullable: true
      required: []
    user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        name:
          type: string
          nullable: true
        provider:
          type: string
          enum:
            - email
            - google
        profile_pic_url:
          type: string
          format: uri
          nullable: true
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        role_names:
          type: array
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - username
        - provider
        - created_at
        - updated_at
    role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        system:
          type: boolean
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
        user_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        action:
          type: string
        resource:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price_unit_amount:
          type: integer
          description: Minor currency units
        price:
          type: string
        currency:
          type: string
          example: usd
        cycle:
          type: string
        period_label:
          type: string
        recurring:
          type: boolean
        free:
          type: boolean
        active:
          type: boolean
        stripe_product_id:
          type: string
        stripe_price_id:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        stripe_subscription_id:
          type: string
        stripe_customer_id:
          type: string
        status:
          type: string
        cycle:
          type: string
        current_period_start:
          type: string
          format: date-time
          nullable: true
        current_period_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
        canceled_at:
          type: string
          format: date-time
          nullable: true
        cancel_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        canceled:
          type: boolean
        ended:
          type: boolean
        scheduled_for_cancellation:
          type: boolean
        cancelable:
          type: boolean
        product_name:
          type: string
        price:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        stripe_payment_intent_id:
          type: string
        status:
          type: string
        price_unit_amount:
          type: string
        currency:
          type: string
        paid_at:
          type: string
          format: date-time
          nullable: true
        refunded_at:
          type: string
          format: date-time
          nullable: true
        paid:
          type: boolean
        pending:
          type: boolean
        failed:
          type: boolean
        product_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    access:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
          nullable: true
        status:
          type: string
        granted_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        remaining_days:
          type: integer
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        metadata:
          type: object
          description:
            Server-owned room metadata. No public request currently accepts
            room metadata.
          additionalProperties: true
        message_count:
          type: integer
        last_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        metadata:
          "$ref": "#/components/schemas/ai_message_metadata"
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/peek":
    get:
      tags:
        - Authentication
      summary: Check whether an email account exists
      parameters:
        - name: X-Locale
          in: header
          required: false
          description:
            Response language. Accepts en or my; Accept-Language is also
            supported.
          schema:
            type: string
            enum:
              - en
              - my
        - name: X-Platform
          in: header
          required: false
          description: Active-session namespace.
          schema:
            type: string
            enum:
              - web
              - mobile
            default: web
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/signup":
    post:
      tags:
        - Authentication
      summary: Create an email account
      parameters:
        - name: X-Locale
          in: header
          required: false
          description:
            Response language. Accepts en or my; Accept-Language is also
            supported.
          schema:
            type: string
            enum:
              - en
              - my
        - name: X-Platform
          in: header
          required: false
          description: Active-session namespace.
          schema:
            type: string
            enum:
              - web
              - mobile
            default: web
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/signup_request"
    delete:
      tags:
        - Authentication
      summary: Delete the current account
      parameters:
        - name: X-Locale
          in: header
          required: false
