          format: uuid
        message_id:
          type: string
          format: uuid
        assets:
          type: array
          description: Empty when TTS fails before an asset is saved.
          items:
            "$ref": "#/components/schemas/asset"
      required:
      - type
      - room_id
      - message_id
    speech_stt_file_request:
      type: object
      properties:
