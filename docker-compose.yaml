services:
  api:
    container_name: ${RAILS_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: ${RAILS_ENV}
      RAILS_JWT_SECRET_KEY: ${RAILS_JWT_SECRET_KEY}
      RAILS_DATABASE_URL: ${RAILS_DATABASE_URL}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-7}
      DB_POOL: ${API_DB_POOL:-7}
      RAILS_CLIENT_BASE_URL: ${RAILS_CLIENT_BASE_URL}
      RAILS_SERVER_BASE_URL: ${RAILS_SERVER_BASE_URL}
    ports:
      - ${RAILS_PORT_MAP}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - coolify.traefik.middlewares=cors@file

  # Solid Queue Worker
  waka:
    container_name: ${WAKA_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: ${RAILS_ENV}
      RAILS_JWT_SECRET_KEY: ${RAILS_JWT_SECRET_KEY}
      RAILS_DATABASE_URL: ${RAILS_DATABASE_URL}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-7}
      DB_POOL: ${WAKA_DB_POOL:-5}
      RAILS_CLIENT_BASE_URL: ${RAILS_CLIENT_BASE_URL}
      RAILS_SERVER_BASE_URL: ${RAILS_SERVER_BASE_URL}
    command: ["./bin/jobs"]
    stop_grace_period: 45s
    labels:
      - coolify.traefik.enable=false

  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    # ports: # enable to access from outside of docker
    #   - ${PG_PORT_MAP}

  # ── MEDIA (Media Worker) ─── [OPTIONAL] ─────────────────
  # Processes :media queue only (video/image compression).
  # Same codebase as api/waka. Disable by not launching this service.
  # Enable via MEDIA_CONTAINER_ENABLED=true in api/waka env.
  media:
    container_name: ${MEDIA_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: ${RAILS_ENV}
      RAILS_JWT_SECRET_KEY: ${RAILS_JWT_SECRET_KEY}
      RAILS_DATABASE_URL: ${RAILS_DATABASE_URL}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-7}
      DB_POOL: ${MEDIA_DB_POOL:-3}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3100}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:3100}
      S3_BUCKET: ${S3_BUCKET:-rexone}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-garage}
    command: ["./bin/jobs", "-c", "config/queue.media.yml"]
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4096M
    labels:
      - coolify.traefik.enable=false

  # ── GARAGE (S3 Storage) ─── [OPTIONAL] ──────────────────
  # Self-hosted S3-compatible object storage.
  # Disable by not launching this service and using STORAGE_PROVIDER=cloudinary.
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: ${GARAGE_CONTAINER_NAME:-rexone-core-garage}
    restart: unless-stopped
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "${GARAGE_S3_PORT_MAP:-3100:3100}"
      - "${GARAGE_ADMIN_PORT_MAP:-3101:3101}"
    labels:
      - coolify.traefik.enable=true

volumes:
  postgres:
  garage-meta:
  garage-data:
