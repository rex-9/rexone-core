# rexone-core/docker-compose.yaml
# Production Docker Compose for Coolify Deployment

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  api:
    container_name: ${RAILS_CONTAINER_NAME:-prod-rexone-api}
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_SECRET_KEY_BASE: ${RAILS_SECRET_KEY_BASE}
      RAILS_DATABASE_URL: ${RAILS_DATABASE_URL}
      RAILS_JWT_SECRET_KEY: ${RAILS_JWT_SECRET_KEY}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-7}
      DB_POOL: ${API_DB_POOL:-7}
      RAILS_CLIENT_BASE_URL: ${RAILS_CLIENT_BASE_URL}
      RAILS_SERVER_BASE_URL: ${RAILS_SERVER_BASE_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:-rexone}
      S3_REGION: ${S3_REGION:-garage}
      S3_FOLDER_PREFIX: ${S3_FOLDER_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${RAILS_PORT_MAP:-3000:3000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging
    networks:
      - rexone-network

  # Solid Queue Default Worker
  waka:
    container_name: ${WAKA_CONTAINER_NAME:-prod-rexone-waka}
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_SECRET_KEY_BASE: ${RAILS_SECRET_KEY_BASE}
      RAILS_DATABASE_URL: ${RAILS_DATABASE_URL}
      RAILS_JWT_SECRET_KEY: ${RAILS_JWT_SECRET_KEY}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-7}
      DB_POOL: ${WAKA_DB_POOL:-10}
      SOLID_QUEUE_FIBERS: ${SOLID_QUEUE_FIBERS:-50}
      SOLID_QUEUE_POLLING_INTERVAL: ${SOLID_QUEUE_POLLING_INTERVAL:-0.1}
      SOLID_QUEUE_MAINTENANCE_THREADS: ${SOLID_QUEUE_MAINTENANCE_THREADS:-2}
      RAILS_CLIENT_BASE_URL: ${RAILS_CLIENT_BASE_URL}
      RAILS_SERVER_BASE_URL: ${RAILS_SERVER_BASE_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:-rexone}
      S3_REGION: ${S3_REGION:-garage}
      S3_FOLDER_PREFIX: ${S3_FOLDER_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    command: ["./bin/jobs"]
    stop_grace_period: 45s
    labels:
      - traefik.enable=false
    logging: *default-logging
    networks:
      - rexone-network

  # Media Worker (FFmpeg video/image transcoding queue)
  media:
    container_name: ${MEDIA_CONTAINER_NAME:-prod-rexone-media}
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_SECRET_KEY_BASE: ${RAILS_SECRET_KEY_BASE}
      RAILS_DATABASE_URL: ${RAILS_DATABASE_URL}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-7}
      DB_POOL: ${MEDIA_DB_POOL:-3}
      MEDIA_QUEUE_THREADS: ${MEDIA_QUEUE_THREADS:-2}

      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:-rexone}
      S3_REGION: ${S3_REGION:-garage}
      S3_FOLDER_PREFIX: ${S3_FOLDER_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    command: ["./bin/jobs", "-c", "config/queue.media.yml"]
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4096M
    labels:
      - traefik.enable=false
    logging: *default-logging
    networks:
      - rexone-network

  # ── OPTIONAL / STANDALONE DB (Profile: with-db) ───────────────────────
  # Can be deployed independently or as part of compose with COMPOSE_PROFILES=with-db
  db:
    container_name: ${DB_CONTAINER_NAME:-prod-rexone-db}
    image: postgres:18-alpine
    profiles: ["with-db", "full"]
    restart: unless-stopped
    volumes:
      - rexone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: ${PG_DATABASE:-rexone_production}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    logging: *default-logging
    networks:
      - rexone-network

  # ── OPTIONAL / STANDALONE GARAGE (Profile: with-garage) ───────────────
  # Can be deployed independently or as part of compose with COMPOSE_PROFILES=with-garage
  # Exactly one Garage container per project, partitioned by folders (e.g. prod/, uat/)
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: ${GARAGE_CONTAINER_NAME:-rexone-garage}
    profiles: ["with-garage", "full"]
    restart: unless-stopped
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - rexone-garage-meta:/var/lib/garage/meta
      - rexone-garage-data:/var/lib/garage/data
    ports:
      - "${S3_PORT_MAP:-3100:3100}"
      - "${S3_ADMIN_PORT_MAP:-3101:3101}"
    labels:
      - traefik.enable=true
      - traefik.http.services.garage.loadbalancer.server.port=3100
    logging: *default-logging
    networks:
      - rexone-network

networks:
  rexone-network:
    name: ${DOCKER_NETWORK:-prod-rexone-net}
    external: ${EXTERNAL_NETWORK:-false}

volumes:
  rexone-postgres-data:
    name: ${POSTGRES_VOLUME:-prod-rexone-postgres-data}
  rexone-garage-meta:
    name: ${GARAGE_META_VOLUME:-rexone-garage-meta}
  rexone-garage-data:
    name: ${GARAGE_DATA_VOLUME:-rexone-garage-data}
