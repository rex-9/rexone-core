name: "🐛 Bug Report"
description: "Report a reproducible bug, defect, or unexpected behavior in RexOne."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before reporting, please ensure the issue has not already been reported and that you have tested against the latest `dev` branch.
  - type: dropdown
    id: affected_component
    attributes:
      label: "Affected Platform / Repository"
      description: "Which part of the RexOne ecosystem is affected?"
      options:
        - "Core API (rexone-core)"
        - "Web Client (rexone-web)"
        - "Mobile App (rexone_mobile)"
        - "Infrastructure & Docker"
        - "Documentation & Architecture"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "How can the maintainers reproduce this issue?"
      placeholder: |
        1. Boot containers with `docker compose up -d`
        2. Run `...`
        3. Observe error `...`
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs_or_errors
    attributes:
      label: "Logs & Terminal Output"
      description: "Paste relevant error traces or terminal logs here (mask any private secrets!)."
      render: shell
  - type: checkboxes
    id: preflight_checks
    attributes:
      label: "Preflight Verification"
      options:
        - label: "I have verified that no sensitive credentials, API keys, or private `.env` tokens are included in this report."
          required: true
        - label: "I have tested this against the latest `dev` branch."
          required: false
