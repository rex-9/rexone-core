name: auth-service-api

services:
  api:
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE}
    env_file:
      - .env
    volumes:
      - .:/rails
    ports:
      - ${RAILS_PORT_MAP}
    depends_on:
      db:
        condition: service_healthy
    # Run server only
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]

  worker:
    build:
      context: .
      dockerfile: ${RAILS_DOCKERFILE}
    env_file:
      - .env
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy
    command: ["./bin/jobs"]

  db:
    image: postgres:18-alpine
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - ${PG_PORT_MAP}

volumes:
  postgres:
