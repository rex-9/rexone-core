paths:
  "/peek":
    get:
      tags:
      - Authentication
      summary: Check whether an email account exists
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/signup":
    post:
      tags:
      - Authentication
      summary: Create an email account
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/signup_request"
    delete:
      tags:
      - Authentication
      summary: Delete the current account
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      security:
      - bearerAuth: []
  "/signin":
    post:
      tags:
      - Authentication
      summary: Sign in with email or username
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/signin_request"
  "/signout":
    delete:
      tags:
      - Authentication
      summary: Sign out the active platform session
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      security:
      - bearerAuth: []
  "/signin/token":
    post:
      tags:
      - Authentication
      summary: Exchange a one-time account token for a JWT
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
