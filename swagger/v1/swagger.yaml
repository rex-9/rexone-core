          type: string
          format: uri
          minLength: 1
          description: Used when no audio file is uploaded. camelCase audioUrl is
            not accepted.
      required:
      - audio_url
    speech_stt_data:
      type: object
      properties:
        text:
          type: string
      required:
      - text
