<!doctype html>
<html>
  <body style="margin:0;background:#14040b;color:#f8f4f6;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#14040b;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#210912;border:1px solid #5a1020;border-radius:18px;padding:28px;">
            <tr><td style="font-size:24px;font-weight:700;color:#ff3048;">Reset your passcode</td></tr>
            <tr><td style="padding-top:16px;font-size:16px;line-height:1.6;color:#e6d9df;">We received a passcode reset request for {{email}}.</td></tr>
            <tr><td style="padding:24px 0;"><a href="{{reset_url}}" style="display:inline-block;background:#ff3048;color:#ffffff;text-decoration:none;border-radius:12px;padding:14px 22px;font-weight:700;">Reset passcode</a></td></tr>
            <tr><td style="font-size:14px;line-height:1.6;color:#b9a7af;">If the button does not work, copy and paste this link into your browser:<br><a href="{{reset_url}}" style="color:#ff6b7d;">{{reset_url}}</a></td></tr>
            <tr><td style="padding-top:18px;font-size:13px;line-height:1.6;color:#b9a7af;">If you did not request this, you can ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
