---
openapi: 3.0.1
info:
  title: Rexone Core API
  version: v1
  description: |
    Production API foundation for authentication, IAM, payments, access,
    media, notifications, client observability, and AI conversations.

    Authenticated endpoints use a bearer JWT. Send `X-Platform` as `web`,
    `android`, or `ios` to select the active session, and `X-Locale` as
    `en`, or `my` to select translated response messages.
tags:
- name: Authentication
  description: Account registration, confirmation, sessions, and password recovery.
- name: Users
  description: Authenticated user profile and effective IAM information.
- name: Admin / Users
  description: Admin dashboard user operations. Requires the admin role and the matching
    user permission.
- name: Admin / Notifications
  description: Admin notification dispatch. Requires the admin role and create_notifications
    permission.
- name: Admin / Accesses
  description: Admin entitlement and access management.
- name: Admin / IAM Permissions
  description: Admin IAM permission operations.
- name: Admin / IAM Roles
  description: Admin IAM role operations.
- name: Admin / Chat Rooms
  description: Admin chat room operations.
- name: Admin / Chat Messages
  description: Admin chat message operations.
- name: Admin / Payment Products
  description: Admin payment product operations.
- name: Admin / Feedbacks
  description: Admin feedback review and triage.
- name: Admin / Analytics
  description: Admin analytics overview metrics and KPIs.
- name: Admin / Assets
  description: Admin asset management, upload, and media compression.
- name: Admin / Versions
  description: Super-admin only version CRUD with discard and restore.
- name: Admin / User Versions
  description: Super-admin only current user version snapshots.
- name: IAM Permissions
  description: Super-admin permission management.
- name: IAM Roles
  description: Role definitions and their permission assignments.
- name: IAM User Roles
  description: Admin-managed role assignments for users.
- name: Payments
  description: Products, checkout sessions, subscriptions, and transactions.
- name: Accesses
  description: Product-access inspection and revocation.
- name: Versions
  description: Public force-update check and authenticated install recording.
- name: Feedbacks
  description: User feedback submission and inspection.
- name: Assets
  description: Asset records and management.
- name: Media
  description: Synchronous multipart asset upload.
- name: AI
  description: Durable queued chat plus synchronous text utilities.
- name: Speech
  description: Text-to-speech synthesis and speech-to-text transcription.
- name: Client Logs
  description: Client error ingestion and authorized operational review.
- name: Webhooks
  description: Provider-signed inbound webhooks.
components:
  schemas:
    async_operation:
      type: object
      properties:
        operation_id:
          type: string
          description: Stable identifier shared by every lifecycle update.
        operation_type:
          type: string
          enum:
          - ai_response
          - asset_compression
          - video_thumbnail
          - notification_delivery
          - payment_webhook
        operation_status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed
        link:
          type: string
          description: Client route for the affected resource.
      required:
      - operation_id
      - operation_type
      - operation_status
      - link
    signup_request:
      type: object
      properties:
        user:
          type: object
          properties:
            username:
              type: string
              pattern: "^[a-z0-9_]+$"
              example: elden_lord
            name:
              type: string
              maxLength: 50
              example: Elden Lord
            email:
              type: string
              format: email
              example: lord@example.com
            password:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            password_confirmation:
              type: string
              format: password
              minLength: 6
              writeOnly: true
          required:
          - username
          - name
          - email
          - password
          - password_confirmation
      required:
      - user
    signin_request:
      type: object
      properties:
        user:
          type: object
          properties:
            signin_key:
              type: string
              description: Email address or username
              example: elden_lord
            password:
              type: string
              format: password
              writeOnly: true
          required:
          - signin_key
          - password
      required:
      - user
    token_signin_request:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          description: One-time account sign-in token.
      required:
      - token
    google_signin_request:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          description: Google identity token.
      required:
      - token
    google_registration_request:
      type: object
      properties:
        challenge_token:
          type: string
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 6
          writeOnly: true
      required:
      - challenge_token
      - password
    confirmation_code_request:
      type: object
      properties:
        signin_key:
          type: string
          description: Email address or username.
      required:
      - signin_key
    confirmation_verify_request:
      type: object
      properties:
        signin_key:
          type: string
          description: Email address or username.
        confirmation_code:
          type: string
          pattern: "^[0-9]{6}$"
          example: '123456'
      required:
      - signin_key
      - confirmation_code
    forgot_password_request:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    reset_password_request:
      type: object
      properties:
        user:
          type: object
          properties:
            reset_password_token:
              type: string
              writeOnly: true
            password:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            password_confirmation:
              type: string
              format: password
              minLength: 6
              writeOnly: true
          required:
          - reset_password_token
          - password
          - password_confirmation
      required:
      - user
    role_request:
      type: object
      properties:
        name:
          type: string
          pattern: "^[a-z0-9_]+$"
          example: content_admin
          description: Custom role name containing only lowercase ASCII letters, digits,
            and underscores.
        description:
          type: string
          nullable: true
        permission_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Permission UUIDs assigned to the role.
      required:
      - name
    permission_request:
      type: object
      properties:
        action:
          type: string
          enum:
          - read
          - create
          - update
          - delete
          example: read
        resource:
          type: string
          enum:
          - users
          - roles
          - user_roles
          - permissions
          - products
          - payments
          - subscriptions
          - transactions
          - accesses
          - assets
          - notifications
          - ai
          - speech
          - logs
          - feedbacks
          - analytics
          - versions
          - user_versions
          example: users
      required: []
    admin_user_request:
      type: object
      properties:
        user:
          type: object
          properties:
            username:
              type: string
              pattern: "^[a-z0-9_]+$"
              example: admin_created
            name:
              type: string
              maxLength: 50
              example: Admin Created
            email:
              type: string
              format: email
              example: admin-created@example.com
            password:
              type: string
              format: password
              minLength: 6
              writeOnly: true
            password_confirmation:
              type: string
              format: password
              minLength: 6
              writeOnly: true
          required: []
      required:
      - user
    current_user_update_request:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
              maxLength: 50
              example: Alice Updated
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: "^[a-z0-9_]+$"
              example: alice_new
          required: []
      required:
      - user
    user_version_request:
      type: object
      properties:
        user_version:
          type: object
          properties:
            version:
              type: string
              example: 1.2.0
              description: Client marketing semver x.y.z
            version_code:
              type: integer
              minimum: 1
              nullable: true
              example: 84
              description: Optional client build number
          required:
          - version
      required:
      - user_version
    admin_version_request:
      type: object
      properties:
        version:
          type: object
          properties:
            number:
              type: string
              example: 1.2.0
              description: Marketing semver x.y.z
            title:
              type: string
              example: Spring release
            description:
              type: string
              nullable: true
              example: Release notes
            is_force_update:
              type: boolean
              example: false
            status:
              type: string
              enum:
              - draft
              - published
              - yanked
              example: draft
            ios_build_number:
              type: integer
              minimum: 1
              nullable: true
              example: 90
            android_build_number:
              type: integer
              minimum: 1
              nullable: true
              example: 84
          required: []
      required:
      - version
    admin_chat_room_request:
      type: object
      properties:
        room:
          type: object
          properties:
            title:
              type: string
              minLength: 1
              example: Support chat
          required:
          - title
      required:
      - room
    admin_chat_message_request:
      type: object
      properties:
        message:
          type: object
          properties:
            role:
              type: string
              enum:
              - user
              - assistant
            content:
              type: string
              minLength: 1
              example: Updated message content
          required: []
      required:
      - message
    admin_product_request:
      type: object
      properties:
        product:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              example: Premium Access
            description:
              type: string
              nullable: true
              example: Unlocks premium features.
            unit_amount:
              type: integer
              minimum: 0
              description: Amount in the smallest currency unit, for example cents.
                Use 0 for a free product.
            currency:
              type: string
              enum:
              - usd
              example: usd
            interval:
              type: string
              nullable: true
              enum:
              - day
              - week
              - month
              - year
              -
              description: Use null for one-time products.
            active:
              type: boolean
              default: true
          required:
          - name
          - unit_amount
          - currency
      required:
      - product
    admin_access_request:
      type: object
      properties:
        access:
          type: object
          properties:
            code:
              type: string
              nullable: true
              example: A1b2C3d4E5
              description: 10-character unique product code (preferred), or product_id.
            product_id:
              type: string
              format: uuid
              nullable: true
              description: Product UUID (alternative to code).
            emails:
              type: array
              nullable: true
              items:
                type: string
                format: email
              description: List of recipient user emails to grant entitlement to.
            usernames:
              type: array
              nullable: true
              items:
                type: string
              description: List of recipient usernames to grant entitlement to.
            user_id:
              type: string
              format: uuid
              nullable: true
              description: Single recipient user UUID (alternative to emails/usernames).
            days:
              type: integer
              minimum: 1
              nullable: true
              example: 30
              description: Entitlement duration in days. Pass null or omit for lifetime
                access.
            expires_at:
              type: string
              format: date-time
              nullable: true
              description: Explicit expiration timestamp. Calculated from days if
                omitted.
          required: []
      required:
      - access
    admin_access_update_request:
      type: object
      properties:
        access:
          type: object
          properties:
            days:
              type: integer
              minimum: 1
              nullable: true
              example: 30
            expires_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              nullable: true
              enum:
              - active
              - expired
              - revoked
          required: []
      required:
      - access
    feedback_request:
      type: object
      properties:
        feedback:
          type: object
          properties:
            content:
              type: string
              example: The checkout flow is very smooth!
            rating:
              type: integer
              minimum: 1
              maximum: 10
              nullable: true
              example: 10
            category:
              type: string
              nullable: true
              example: general
            priority:
              type: string
              nullable: true
              example: normal
            platform:
              type: string
              nullable: true
              example: web
            app_version:
              type: string
              nullable: true
              example: 1.0.0
              description: Client marketing semver. Looked up against versions.number
                and stored as version_id. Unknown or missing leaves version_id null.
            os:
              type: string
              nullable: true
              example: mac
            device:
              type: string
              nullable: true
              example: MacBookPro
            browser:
              type: string
              nullable: true
              example: Chrome
            page:
              type: string
              nullable: true
              example: "/home"
            metadata:
              type: object
              nullable: true
              additionalProperties: true
          required:
          - content
      required:
      - feedback
    admin_feedback_update_request:
      type: object
      properties:
        feedback:
          type: object
          properties:
            status:
              type: string
              nullable: true
              example: resolved
            category:
              type: string
              nullable: true
            priority:
              type: string
              nullable: true
            admin_notes:
              type: string
              nullable: true
          required: []
      required:
      - feedback
    asset_request:
      type: object
      properties:
        asset:
          type: object
          properties:
            storage_key:
              type: string
              nullable: true
            type:
              type: string
              nullable: true
            format:
              type: string
              nullable: true
            source:
              type: string
              nullable: true
            assetable_type:
              type: string
              nullable: true
            assetable_id:
              type: string
              format: uuid
              nullable: true
            size_bytes:
              type: integer
              nullable: true
            duration_secs:
              type: integer
              nullable: true
            extension:
              type: string
              nullable: true
          required: []
      required:
      - asset
    asset_update_request:
      type: object
      properties:
        asset:
          type: object
          properties:
            storage_key:
              type: string
              nullable: true
            type:
              type: string
              nullable: true
            format:
              type: string
              nullable: true
            source:
              type: string
              nullable: true
            assetable_type:
              type: string
              nullable: true
            assetable_id:
              type: string
              format: uuid
              nullable: true
            size_bytes:
              type: integer
              nullable: true
            duration_secs:
              type: integer
              nullable: true
            extension:
              type: string
              nullable: true
          required: []
      required:
      - asset
    user_role_request:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
          description: Role UUID to assign to the path user.
      required:
      - role_id
    client_log_context:
      type: object
      description: Free-form, JSON-safe diagnostic context supplied by the client.
        Do not include secrets or tokens.
      additionalProperties: true
      example:
        component: CheckoutPage
        action: loadSession
        attempt: 2
    client_log_request:
      type: object
      properties:
        log:
          type: object
          properties:
            message:
              type: string
              example: Checkout request failed
            severity:
              type: string
              enum:
              - debug
              - info
              - warning
              - error
              - critical
              default: error
            platform:
              type: string
              enum:
              - web
              - ios
              - android
              nullable: true
            environment:
              type: string
              enum:
              - development
              - staging
              - production
              nullable: true
            app_version:
              type: string
              nullable: true
              description: Client marketing semver. Looked up against versions.number
                and stored as version_id. Unknown or missing leaves version_id null.
            browser:
              type: string
              nullable: true
            user_agent:
              type: string
              nullable: true
            os:
              type: string
              nullable: true
            os_version:
              type: string
              nullable: true
            device:
              type: string
              nullable: true
            url:
              type: string
              format: uri
              nullable: true
            method:
              type: string
              example: POST
              nullable: true
            context:
              "$ref": "#/components/schemas/client_log_context"
            stack_trace:
              type: array
              items:
                type: string
            local_storage_keys:
              type: array
              items:
                type: string
            session_storage_keys:
              type: array
              items:
                type: string
            cookies:
              type: object
              description: Cookie names and diagnostic values. Do not submit authentication
                cookies or secrets.
              additionalProperties:
                type: string
          required:
          - message
      required:
      - log
    notification_request:
      type: object
      properties:
        event:
          type: string
          description: Notification event or UUID whose server-side template supplies
            the title and message.
        audience:
          description: Use exactly one audience shape. Role matches use OR semantics
            and each user is notified once.
          oneOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - users
              user_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  format: uuid
            required:
            - type
            - user_ids
          - type: object
            properties:
              type:
                type: string
                enum:
                - roles
              role_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  format: uuid
            required:
            - type
            - role_ids
          - type: object
            properties:
              type:
                type: string
                enum:
                - all
            required:
            - type
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - socket
            - push
            - email
          description: 'One or more delivery channels: socket, push, or email.'
      required:
      - event
      - audience
      - channels
    notification_template_request:
      type: object
      properties:
        event:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        link:
          type: string
          nullable: true
          pattern: "^(?:/(?:home|profile|payment|ai)|https://.+)$"
          description: Optional shared in-app route or absolute HTTPS external destination.
        clients:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
          default:
          - web
          - mobile
          description: Clients allowed to receive this in-app notification, such as
            web or mobile.
        admin:
          type: boolean
        in_app_title:
          type: string
          nullable: true
        in_app_body:
          type: string
          nullable: true
        in_app_data:
          type: object
          additionalProperties: true
        push_title:
          type: string
          nullable: true
        push_body:
          type: string
          nullable: true
        push_template_id:
          type: string
          nullable: true
        email_subject:
          type: string
          nullable: true
        email_body:
          type: string
          nullable: true
        email_template_id:
          type: string
          nullable: true
      required:
      - event
      - name
      - category
    id_batch_request:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
      - ids
    asset_upload_request:
      type: object
      properties:
        file:
          type: string
          format: binary
        type:
          type: string
          default: general
          description: 'Asset type: avatar, cover, card, audio, video, attachment,
            general.'
        assetable_type:
          type: string
          description: 'Resource model name: user, course, lesson, monastery, teacher,
            message.'
        assetable_id:
          type: string
          format: uuid
          description: UUID of the linked resource.
        duration_secs:
          type: integer
          description: Duration in seconds for audio / video files.
        size_bytes:
          type: integer
          description: Exact file size in bytes.
      required:
      - file
    asset_thumbnail_upload_request:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    asset_subtitle_upload_request:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    checkout_session_request:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        success_url:
          type: string
          format: uri
          description: Client URL used by Stripe after success.
        cancel_url:
          type: string
          format: uri
          description: Client URL used by Stripe after cancellation.
      required:
      - product_id
      - success_url
      - cancel_url
    ai_chat_request:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        room_id:
          type: string
          format: uuid
          description: Existing owned room UUID. Omit to use or create the current
            room.
        system_prompt:
          type: string
          nullable: true
          description: Optional instruction prepended to this request.
        temperature:
          type: number
          format: float
          default: 0.7
          minimum: 0
        max_tokens:
          type: integer
          default: 2000
          minimum: 1
      required:
      - message
    ai_rename_request:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        room_id:
          type: string
          format: uuid
          description: Owned room UUID. Omit to use the current room.
      required:
      - title
    ai_room_request:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Omit to use the translated default room title.
      required: []
    ai_text_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
      - text
    ai_translate_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
          description: Natural-language target such as English, Myanmar, Japanese,
            or Spanish; not a fixed enum.
      required:
      - text
      - language
    ai_analyze_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - sentiment
          - entities
          - keywords
          default: sentiment
      required:
      - text
    speech_tts_request:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: Required for sync MP3 responses. Ignored when message_id is
            present.
        message_id:
          type: string
          format: uuid
          description: Queue async TTS for a chat message owned by the current user.
            Text comes from the message content.
        voice_name:
          type: string
          description: Provider voice name for sync TTS only. Omit to use the provider
            default. camelCase voiceName is not accepted.
      required: []
    speech_tts_queued_data:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - processing
          - retrying
          - completed
          - failed
        job_id:
          type: string
      required:
      - message_id
      - room_id
      - status
      - job_id
    speech_tts_queued_response:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              example: 200
            success:
              type: boolean
              example: true
            message:
              type: string
          required:
          - code
          - success
          - message
        data:
          "$ref": "#/components/schemas/speech_tts_queued_data"
      required:
      - status
    speech_tts_ready_notification_data:
      type: object
      properties:
        type:
          type: string
          enum:
          - tts_ready
        room_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        assets:
          type: array
          description: Full Asset objects for this message. Play TTS via the audio
            item's url.
          items:
            "$ref": "#/components/schemas/asset"
      required:
      - type
      - room_id
      - message_id
      - assets
    speech_tts_failed_notification_data:
