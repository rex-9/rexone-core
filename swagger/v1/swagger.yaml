---
openapi: 3.0.1
info:
  title: Rexone Core API
  version: v1
  description: |
    Production API foundation for authentication, IAM, payments, access,
    media, notifications, client observability, and AI conversations.

    Authenticated endpoints use a bearer JWT. Send `X-Platform` as `web`
    or `mobile` to select the active session, and `X-Locale` as `en` or
    `my` to select translated response messages.
tags:
- name: Authentication
- name: Users
- name: Admin Users
- name: IAM Permissions
- name: IAM Roles
- name: IAM User Roles
- name: Payments
- name: Access
- name: Media
- name: Notifications
- name: AI
- name: Client Logs
- name: Webhooks
components:
  schemas:
    response:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              example: 200
            success:
              type: boolean
              example: true
            message:
              type: string
          required:
          - code
          - success
          - message
        data:
          nullable: true
        meta:
          type: object
          properties:
            pagination:
              "$ref": "#/components/schemas/pagination"
          required: []
      required:
      - status
    error_response:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              example: 422
            success:
              type: boolean
              example: false
            message:
              type: string
            error:
              type: string
          required:
          - code
          - success
          - message
        data:
          nullable: true
      required:
      - status
    pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        limit:
          type: integer
        next_page:
          type: integer
          nullable: true
        prev_page:
          type: integer
          nullable: true
      required: []
    user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        name:
          type: string
          nullable: true
        provider:
          type: string
          enum:
          - email
          - google
        profile_pic_url:
          type: string
          format: uri
          nullable: true
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        role_names:
          type: array
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - email
      - username
      - provider
      - created_at
      - updated_at
    signup:
      type: object
      properties:
        user:
          type: object
          properties:
            username:
              type: string
              pattern: "^[a-z0-9_]+$"
            name:
              type: string
              maxLength: 50
            email:
              type: string
              format: email
            password:
              type: string
              format: password
              minLength: 6
            password_confirmation:
              type: string
              format: password
          required:
          - username
          - name
          - email
          - password
          - password_confirmation
      required:
      - user
    signin:
      type: object
      properties:
        user:
          type: object
          properties:
            signin_key:
              type: string
              description: Email address or username
            password:
              type: string
              format: password
          required:
          - signin_key
          - password
      required:
      - user
    role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        system:
          type: boolean
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
        user_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    role_input:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - name
    permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        action:
          type: string
        resource:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    permission_input:
      type: object
      properties:
        permission:
          type: object
          properties:
            action:
              type: string
            resource:
              type: string
          required:
          - action
          - resource
      required:
      - permission
    product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price_unit_amount:
          type: integer
          description: Minor currency units
        price:
          type: string
        currency:
          type: string
          example: usd
        cycle:
          type: string
        period_label:
          type: string
        recurring:
          type: boolean
        active:
          type: boolean
        stripe_product_id:
          type: string
        stripe_price_id:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        stripe_subscription_id:
          type: string
        stripe_customer_id:
          type: string
        status:
          type: string
        cycle:
          type: string
        current_period_start:
          type: string
          format: date-time
          nullable: true
        current_period_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
        canceled_at:
          type: string
          format: date-time
          nullable: true
        cancel_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        canceled:
          type: boolean
        ended:
          type: boolean
        scheduled_for_cancellation:
          type: boolean
        cancelable:
          type: boolean
        product_name:
          type: string
        price:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        stripe_payment_intent_id:
          type: string
        status:
          type: string
        price_unit_amount:
          type: string
        currency:
          type: string
        paid_at:
          type: string
          format: date-time
          nullable: true
        refunded_at:
          type: string
          format: date-time
          nullable: true
        paid:
          type: boolean
        pending:
          type: boolean
        failed:
          type: boolean
        product_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    access:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
          nullable: true
        status:
          type: string
        granted_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        days_remaining:
          type: integer
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        metadata:
          type: object
        message_count:
          type: integer
        last_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
          - system
        content:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: []
    log_input:
      type: object
      properties:
        log:
          type: object
          properties:
            message:
              type: string
            severity:
              type: string
              default: error
            platform:
              type: string
            environment:
              type: string
            context:
              type: object
            stack_trace:
              type: array
              items:
                type: string
            url:
              type: string
            method:
              type: string
          required:
          - message
      required:
      - log
    notification:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        message:
          type: string
        title:
          type: string
        data:
          type: object
      required:
      - user_id
      - message
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/peek":
    get:
      tags:
      - Authentication
      summary: Check whether an email account exists
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/signup":
    post:
      tags:
      - Authentication
      summary: Create an email account
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/signup"
    delete:
      tags:
      - Authentication
      summary: Delete the current account
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      security:
      - bearerAuth: []
  "/signin":
    post:
      tags:
      - Authentication
      summary: Sign in with email or username
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/signin"
  "/signout":
    delete:
      tags:
      - Authentication
      summary: Sign out the active platform session
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      security:
      - bearerAuth: []
  "/signin/token":
    post:
      tags:
      - Authentication
      summary: Exchange a one-time account token for a JWT
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
  "/signin/google":
    post:
      tags:
      - Authentication
      summary: Start Google sign-in
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
  "/signin/google/complete":
    post:
      tags:
      - Authentication
      summary: Complete Google registration with a passcode
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
              required:
              - challenge_token
              - password
  "/confirmation":
    get:
      tags:
      - Authentication
      summary: Confirm an email link and redirect to the web client
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      - name: confirmation_token
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
  "/confirmation/send_code":
    post:
      tags:
      - Authentication
      summary: Send a new email confirmation code
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signin_key:
                  type: string
              required:
              - signin_key
  "/confirmation/confirm_code":
    post:
      tags:
      - Authentication
      summary: Confirm an account using its email code
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signin_key:
                  type: string
                confirmation_code:
                  type: string
                  example: '123456'
              required:
              - signin_key
              - confirmation_code
  "/password/forgot":
    post:
      tags:
      - Authentication
      summary: Request a password reset email
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
  "/password/reset":
    put:
      tags:
      - Authentication
      summary: Reset a password using a reset token
      parameters:
      - name: X-Locale
        in: header
        required: false
        description: Response language. Accepts en or my; Accept-Language is also
          supported.
        schema:
          type: string
          enum:
          - en
          - my
      - name: X-Platform
        in: header
        required: false
        description: Active-session namespace.
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/response"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    reset_password_token:
                      type: string
                    password:
                      type: string
                      format: password
                    password_confirmation:
                      type: string
                      format: password
                  required:
                  - reset_password_token
                  - password
                  - password_confirmation
              required:
              - user
  "/webhooks/stripe":
    post:
      tags:
      - Webhooks
      summary: Receive, persist, and queue a Stripe webhook
      parameters:
      - name: X-Locale
        in: header
