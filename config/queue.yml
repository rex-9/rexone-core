# config/queue.yml
# TODO: need to test with dev
default: &default # How often to poll for new jobs (in seconds)
  dispatchers:
    - polling_interval: 0.1
      shutdown_timeout: 30 # Graceful shutdown timeout
      # batch_size: 500

development:
  <<: *default
  workers:
    - queues: "*"
      threads: 5 # Use threads in dev for simplicity
      polling_interval: 0.5

test:
  <<: *default
  workers:
    - queues: "*"
      threads: 1 # Single thread to keep tests fast

production:
  <<: *default
  # Total: 34 concurrent jobs - 5 workers
  workers:
    # Worker 1: General jobs — start with threads
    - queues: "default"
      threads: 5
      polling_interval: 0.05

    # Worker 2: Mailers — I/O heavy, use fibers
    - queues: "mailers"
      fibers: 20
      polling_interval: 0.05

    # Worker 3: Image processing — CPU heavy, use threads
    - queues: "image_processing"
      threads: 3
      polling_interval: 0.05

    # Worker 4: Active Storage — mix of I/O and CPU
    - queues: "active_storage_analysis,active_storage_purge"
      threads: 3
      polling_interval: 0.05

    # Worker 5: Catch-all for anything else — conservative
    - queues: "*"
      threads: 3
      polling_interval: 0.05
